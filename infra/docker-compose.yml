# Local development infrastructure for the Educated platform.
# Start:  docker compose -f infra/docker-compose.yml up -d
# All passwords below are LOCAL DEVELOPMENT values only (see infra/.env.example to override them).
name: educated

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: educated
      POSTGRES_USER: educated
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educated_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educated -d educated"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: educated
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-educated_dev}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Dev-xF9eO2sOxj9HJM!}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.2-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: educated
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-educated_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # S3-compatible object storage (replaces MinIO, whose images are no longer published).
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches every e-mail sent in development (web UI on http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
